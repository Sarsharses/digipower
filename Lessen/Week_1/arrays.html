<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Arrays</title>
    <script src="../common/load-navbar.js"></script>
    <link rel="stylesheet" href="../common/style.css">
    <style>
        button {
            width: 70px;
        }

        img {
            border-radius: 20px;
            border: 15px solid brown;
        }
    </style>
    <script>
        const animals = ['Wolf', 'Panda', 'Eagle', 'Sheep', 'Rhino', 'Tiger', 'Elephant', 'Lion', 'Bear', 'Monkey'];
        let index = 0;

        function previousPhoto() {
            index--;
            if (index < 0) {
                index = animals.length - 1;
            }
            showPhoto();
        }

        function nextPhoto() {
            index++;
            if (index === animals.length) {
                index = 0;
            }
            showPhoto();
        }

        function showPhoto() {
            let counter = document.getElementById('counter');
            let photo = document.getElementById('photo');
            let description = document.getElementById('description');

            counter.innerHTML = `Foto ${index + 1} van ${animals.length}`;
            photo.src = `https://xanderwemmers.nl/${animals[index]}.jpg`;
            photo.title = animals[index];
            photo.alt = animals[index];
            description.innerHTML = animals[index];
        }

        document.addEventListener('navbarLoaded', () => {
            $("#menu").menu();
        });
    </script>
</head>
<body onload="showPhoto()">

<h1>Dierentuin</h1>

<p id="counter"></p>

<img id="photo" src="" height="200" alt="" title="">

<h3 id="description"></h3>

<button onclick="previousPhoto()">&lt;</button>
<button onclick="nextPhoto()">&gt;</button>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
    body {
        font-family: arial;
        text-align: center;
        background-color: beige;
    }

    button {
        border-radius: 20px;
        box-shadow: 2px 2px 5px darkgreen;
        margin: 5px;
    }

    button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    img {
        margin: 20px;
        height: 100px;
    }

    nav {
        text-align: left;
        border: 2px solid grey;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 20px;
    }

    .navItem {
        border: 1px solid black;
        border-radius: 20px;
        padding: 5px;
        font-weight: bold;
    }
</style>
<script>
    var votes = {
        'Londen': 0,
        'Parijs': 0,
        'Berlijn': 0,
        'Barcelona': 0
    };

    var voteCount = 0;

    function vote(city) {
        voteCount++;
        votes[city]++;
        showResults();
        if (voteCount === 10) {
            disableButtons();
        }
    }

    function addButtons() {
        var buttonsEl = document.getElementById('buttonsEl');
        buttonsEl.innerHTML = '';

        for (let city in votes) {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.onclick = function() {
                vote(city);
            };

            const img = document.createElement('img');
            img.className = 'img';
            img.src = `img/${city.toLowerCase()}.jpg`;
            btn.append(img);
            buttonsEl.append(btn);
        }

        showResults();
    }

    function showResults() {
        var results = document.getElementById('results');
        results.innerHTML = '';

        for (var city in votes) {
            var percentage = votes[city] / voteCount * 100;
            percentage = percentage.toFixed(1);

            if (isNaN(percentage)) {
                percentage = 0;
            }

            var p = document.createElement('p');
            p.innerHTML = `Er is ${votes[city]} keer gestemd op ${city}. ${percentage}%`;

            results.append(p);
        }

        setCounter();
        declareWinner();
    }

    function setCounter() {
        var voteCounterEl = document.getElementById('voteCounter');
        voteCounterEl.innerHTML = voteCount;
    }

    function disableButtons() {
        var buttonEls = document.querySelectorAll('.btn');
        for (const button of buttonEls) {
            button.setAttribute('disabled', '');
        }
    }

    function enableButtons() {
        var buttonEls = document.querySelectorAll('.btn');
        for (const button of buttonEls) {
            button.removeAttribute('disabled');
        }
    }

    function declareWinner() {
        var winnerEl = document.getElementById('winner');
        var highestCount = 0;
        var winners = [];

        if (voteCount === 0) {
            winnerEl.innerHTML = 'Er is nog geen winnaar';
            return;
        }

        for (var city in votes) {
            if (votes[city] > highestCount) {
                highestCount = votes[city];
                winners = [city];
            } else if (votes[city] === highestCount && highestCount > 0) {
                winners.push(city);
            }
        }
        if (winners.length > 1) {
            winnerEl.innerHTML = `De winnaars zijn: ${winners}`;
        } else {
            winnerEl.innerHTML = `De winnaar is: ${winners}`;
        }
    }

    function reset() {
        for (var city in votes) {
            votes[city] = 0;
        }
        var winnerEl = document.getElementById('winner');
        winnerEl.innerHTML = '';
        voteCount = 0;
        enableButtons();
        showResults();
    }
</script>
<body onload="addButtons()">
<nav>
    <a class="navItem" href="berekening.html">Berekening</a>
    <a class="navItem" href="arrays.html">Dierentuin</a>
    <a class="navItem" href="stemmen.html">Stemmen</a>
</nav>

<h1>Waarheen op vakantie?</h1>

<div id="buttonsEl"></div>

<div id="results">
</div>

<h3>Er is <span id="voteCounter"></span> keer gestemd</h3>

<h3 id="winner"></h3>

<button onclick="reset()">Reset</button>
</body>
</html>

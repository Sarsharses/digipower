<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <style>
        body {
            font-family: arial;
            text-align: center;
        }

        #output {
            background-color: lightgreen;
            border: 3px solid green;
            width: 300px;
            margin: 20px auto;
            padding: 10px;
            border-radius: 10px;
        }

        #output.warning {
            border: 3px solid red;
            background-color: pink;
        }
    </style>

    <script>
        function calculate() {
            var output = document.getElementById('output');
            var input = document.getElementById('amountInput');
            var amount = input.value;

            // Accept comma notated numbers
            amount = amount.replace(',', '.');

            // Validate input
            if (isNaN(amount)) {
                output.innerHTML = 'Voer een getal in!';
                output.className = 'warning';
                return
            }

            output.className = '';
            var today = new Date();
            var start = today.getFullYear() + 1;
            var end = start + 10;

            output.innerHTML = '';

            for (var i = start; i < end; i++) {
                amount *= 1.05;
                var displayAmount = amount.toFixed(2).replace('.',',');
                output.innerHTML += `<p>In ${i} heb je €${displayAmount}</p>`;
            }

            return amount;
        }
    </script>
</head>
<body>
<div class="main-container">

    <h1>Berekening</h1>

    <form onsubmit="calculate(); return false">
        <label for="amountInput">Kapitaal:</label>
        <input id="amountInput" value="1000">
        <button type="submit">Bereken</button>
    </form>

    <div id="output">Hier komt straks het antwoord</div>


</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <style>
        body {
            font-family: arial;
            text-align: center;
            background-color: beige;
        }

        #output {
            background-color: lightgreen;
            border: 3px solid green;
            width: 300px;
            margin: 20px auto;
            padding: 10px;
            border-radius: 10px;
        }

        #output.warning {
            border: 3px solid red;
            background-color: pink;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }

        input, select {
            width: 100px;
        }

        button {
            margin-top: 10px;
        }

        table {
            border-collapse: collapse;
            margin-top: 2px;
            margin-left: auto;
            margin-right: auto;
        }

        td {
            border: solid 1px black;
            width: 180px;
        }

        nav {
            text-align: left;
            border: 2px solid grey;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 20px;
        }

        .navItem {
            border: 1px solid black;
            border-radius: 20px;
            padding: 5px;
            font-weight: bold;
        }
    </style>

    <script>
        let count = 0;

        function calculate() {
            let output = document.getElementById('output');

            let duration = parseInt(document.getElementById('duration').value);
            let interest = parseFloat(document.getElementById('interest').value);
            let amount = document.getElementById('amount').value;
            let factor = 1 + (interest / 100);

            // Accept comma notated numbers
            amount = amount.replace(',', '.');

            // Validate input
            if (isNaN(amount) || isNaN(interest)) {
                output.innerHTML = 'Voer een getal in!';
                output.className = 'warning';
                return
            }

            output.className = '';
            output.innerHTML = '';

            let today = new Date();
            let start = today.getFullYear() + 1;
            let end = start + duration;

            for (let i = start; i < end; i++) {
                amount *= factor;
                let displayAmount = amount.toFixed(2).replace('.', ',');
                output.innerHTML += `<p>In ${i} heb je €${displayAmount}</p>`;
            }

            return amount;
        }


        // Recursive functions
        function recursiveInvestment(currentYear, endYear, balance, yearlyInlay, interest, outputHTML = "", totalInlay = 0) {
            if (currentYear >= endYear) {
                return {balance, outputHTML, totalInlay};
            }

            // Add yearly inlay (can be 0)
            balance += yearlyInlay;
            totalInlay += yearlyInlay;
            count++;

            // Apply interest
            balance *= 1 + (interest / 100);

            // Prepare display numbers
            const displayTotal = totalInlay.toFixed(2).replace('.', ',');
            const difference = balance - totalInlay;
            const displayBalance = balance.toFixed(2).replace('.', ',');
            const displayDifference = difference.toFixed(2).replace('.', ',');

            // Append to output
            outputHTML += `<p>
                <strong>In ${currentYear} heb je:</strong>
                <table>
                    <tr><td>Totaal ingelegd</td><td>€${displayTotal}</td></tr>
                    <tr><td>Totaal balans</td><td>€${displayBalance}</td></tr>
                    <tr><td>Verschil</td><td>€${displayDifference}</td></tr>
                </table>
            </p>`;

            return recursiveInvestment(currentYear + 1, endYear, balance, yearlyInlay, interest, outputHTML, totalInlay);
        }

        function calculateRecursive() {
            count = 0;

            const duration = parseInt(document.getElementById('duration').value);
            const interest = parseFloat(document.getElementById('interest').value);
            let yearlyInlay = parseFloat(document.getElementById('amount').value.replace(',', '.'));
            let startCapital = parseFloat(document.getElementById('start').value.replace(',', '.'));

            if (isNaN(yearlyInlay) || isNaN(interest) || isNaN(startCapital)) {
                alert('Voer geldige getallen in!');
                return;
            }

            const startYear = new Date().getFullYear() + 1;
            const endYear = startYear + duration;

            const result = recursiveInvestment(startYear, endYear, startCapital, yearlyInlay, interest);

            document.getElementById('output').innerHTML = `
                ${result.outputHTML}
                <p><strong>Na ${duration} jaar met startkapitaal van €${startCapital.toFixed(2)}
                en jaarlijkse inleg van €${yearlyInlay.toFixed(2)}, heb je na ${duration} jaar
                met ${interest}% rente een totaal van: €${result.balance.toFixed(2)}</strong></p>`;
        }

    </script>
</head>
<body>
<nav>
    <a class="navItem" href="berekening.html">Berekening</a>
    <a class="navItem" href="arrays.html">Dierentuin</a>
    <a class="navItem" href="stemmen.html">Stemmen</a>
</nav>

<h1>Berekening</h1>

<form onsubmit="calculateRecursive(); return false">
    <label for="duration">Aantal jaren:</label>
    <select id="duration">
        <option value="5">5 jaar</option>
        <option value="10" selected>10 jaar</option>
        <option value="15">15 jaar</option>
        <option value="20">20 jaar</option>
        <option value="25">25 jaar</option>
    </select>
    <br>

    <label for="interest">Aantal % rente:</label>
    <input id="interest" type="number" min="1" max="10" step="0.25" value="5">
    <br>

    <label for="amount">Jaarlijkse inleg:</label>
    <input id="amount" value="1000">
    <br>

    <label for="start">Startkapitaal (optioneel):</label>
    <input id="start" value="0">
    <br>

    <button type="submit">Bereken</button>
</form>

<div id="output">Hier komt straks het antwoord</div>
</body>
</html>

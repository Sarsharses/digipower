<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <style>
        body {
            font-family: arial;
            text-align: center;
            background-color: beige;
        }

        #output {
            background-color: lightgreen;
            border: 3px solid green;
            width: 300px;
            margin: 20px auto;
            padding: 10px;
            border-radius: 10px;
        }

        #output.warning {
            border: 3px solid red;
            background-color: pink;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }

        input, select {
            width: 100px;
        }

        button {
            margin-top: 10px;
        }

        table {
            border-collapse: collapse;
            margin-top: 2px;
            margin-left: auto;
            margin-right: auto;
        }

        td {
            border: solid 1px black;
            width: 180px;
        }
    </style>

    <script>
        var count = 0;

        function calculate() {
            var output = document.getElementById('output');

            var duration = parseInt(document.getElementById('duration').value);
            var interest = parseFloat(document.getElementById('interest').value);
            var amount = document.getElementById('amount').value;
            var factor = 1 + (interest / 100);

            // Accept comma notated numbers
            amount = amount.replace(',', '.');

            // Validate input
            if (isNaN(amount) || isNaN(interest)) {
                output.innerHTML = 'Voer een getal in!';
                output.className = 'warning';
                return
            }

            output.className = '';
            output.innerHTML = '';

            var today = new Date();
            var start = today.getFullYear() + 1;
            var end = start + duration;

            for (var i = start; i < end; i++) {
                amount *= factor;
                var displayAmount = amount.toFixed(2).replace('.', ',');
                output.innerHTML += `<p>In ${i} heb je €${displayAmount}</p>`;
            }

            return amount;
        }


        // Recursive functions
        function recursiveInvestment(currentYear, endYear, balance, yearlyInlay, interest, outputHTML = "") {
            if (currentYear >= endYear) {
                return {balance, outputHTML}; // base case returns both balance and HTML
            }

            // Add the yearly inlay at the start of each year
            balance += yearlyInlay;
            count++;

            // Apply interest
            balance *= 1 + (interest / 100);

            // Append year result as a <p> tag
            const total = (yearlyInlay * count).toFixed(2).replace('.', ',');
            const difference = balance - (yearlyInlay * count);
            const displayBalance = balance.toFixed(2).replace('.', ',');
            const displayDifference = difference.toFixed(2).replace('.', ',');

            outputHTML += `<p>
                                <strong>
                                In ${currentYear} heb je:
                                </strong>
                                <table>
                                    <tr>
                                        <td>Totaal ingelegd</td>
                                        <td>€${total}</td>
                                    </tr>
                                    <tr>
                                        <td>Totaal balans</td>
                                        <td>€${displayBalance}</td>
                                    </tr>
                                    <tr>
                                        <td>Verschil</td>
                                        <td>€${displayDifference}</td>
                                    </tr>
                                </table>
                            </p>`;

            // Recursive step for next year
            return recursiveInvestment(currentYear + 1, endYear, balance, yearlyInlay, interest, outputHTML);
        }

        function calculateRecursive() {
            // Reset global counter and base balance
            count = 0;
            let balance = 0;

            const duration = parseInt(document.getElementById('duration').value);
            const interest = parseFloat(document.getElementById('interest').value);
            let amount = parseFloat(document.getElementById('amount').value.replace(',', '.'));

            if (isNaN(amount) || isNaN(interest)) {
                alert('Voer een geldig getal in!');
                return;
            }

            const startYear = new Date().getFullYear() + 1;
            const endYear = startYear + duration;

            const result = recursiveInvestment(startYear, endYear, balance, amount, interest);

            document.getElementById('output').innerHTML =
                `${result.outputHTML}<p><strong>Na ${duration} jaar met jaarlijkse inleg van €${amount.toFixed(2)}, voor een totaal van €${(amount * duration).toFixed(2)}, en ${interest}% rente heb je: €${result.balance.toFixed(2)}</strong></p>`;
        }

    </script>
</head>
<body>
<nav>
    <a href="berekening.html">Berekening</a>
    <a href="arrays.html">Dierentuin</a>
</nav>

<h1>Berekening</h1>

<form onsubmit="calculateRecursive(); return false">
    <label for="duration">Aantal jaren:</label>
    <select id="duration">
        <option value="5">5 jaar</option>
        <option value="10" selected>10 jaar</option>
        <option value="15">15 jaar</option>
        <option value="20">20 jaar</option>
        <option value="25">25 jaar</option>
    </select>
    <br>

    <label for="interest">Aantal % rente:</label>
    <input id="interest" type="number" min="1" max="10" step="0.25" value="5">
    <br>

    <label for="amount">Kapitaal:</label>
    <input id="amount" value="1000">
    <br>

    <button type="submit">Bereken</button>
</form>

<div id="output">Hier komt straks het antwoord</div>
</body>
</html>

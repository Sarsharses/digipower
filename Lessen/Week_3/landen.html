<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            padding: 10px;
            text-align: left;
        }

        td:nth-child(4) {
            text-align: right;
        }

        tr:nth-child(even) {
            background-color: antiquewhite;
        }

        tr:nth-child(odd) {
            background-color: bisque;
        }

        .clickable {
            cursor: pointer;
        }

        tr:first-child {
            background-color: crimson;
            color: white;
        }

        tr.selected {
            background-color: lightgreen;
        }
    </style>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <script src="../common/load-navbar.js"></script>

    <script>
        let allCountries;
        let currentCountries;
        let isInitialized = false;

        let sortFlags = {
            population: false,
            region: false,
            subRegion: false,
            capital: false,
            area: false,
            density: false,
            name: false
        };

        let regionList = [];

        function init() {
            $.getJSON('https://restcountries.com/v3.1/all?fields=name,region,subregion,population,capital,flags,area', showCountries);

            $('#regionSelect').on('change', function () {
                filterByRegion(this.value);
            });
        }

        /*
         * SORTERS
         */
        function sortByPopulation() {
            if (!isInitialized) {
                currentCountries.sort((a, b) => b.population - a.population);
            } else {
                sortFlags.population
                    ? currentCountries.sort((a, b) => b.population - a.population)
                    : currentCountries.sort((a, b) => a.population - b.population);
                sortFlags.population = !sortFlags.population;
                showCountries(currentCountries);
            }
        }

        function sortByName() {
            sortFlags.name
                ? currentCountries.sort((a, b) => b.name.common.localeCompare(a.name.common))
                : currentCountries.sort((a, b) => a.name.common.localeCompare(b.name.common));
            sortFlags.name = !sortFlags.name;
            showCountries(currentCountries);
        }

        function sortByRegion() {
            sortFlags.region
                ? currentCountries.sort((a, b) => b.region.localeCompare(a.region))
                : currentCountries.sort((a, b) => a.region.localeCompare(b.region));
            sortFlags.region = !sortFlags.region;
            showCountries(currentCountries);
        }

        function sortBySubRegion() {
            sortFlags.subRegion
                ? currentCountries.sort((a, b) => b.subregion.localeCompare(a.subregion))
                : currentCountries.sort((a, b) => a.subregion.localeCompare(b.subregion));
            sortFlags.subRegion = !sortFlags.subRegion;
            showCountries(currentCountries);
        }

        function sortByCapital() {
            sortFlags.capital
                ? currentCountries.sort(
                    (a, b) =>
                        (b.capital?.[0] || '')
                            .localeCompare((a.capital?.[0] || ''))
                )
                : currentCountries.sort(
                    (a, b) =>
                        (a.capital?.[0] || '')
                            .localeCompare((b.capital?.[0] || ''))
                );
            sortFlags.capital = !sortFlags.capital;
            showCountries(currentCountries);
        }

        function sortByArea() {
            sortFlags.area
                ? currentCountries.sort((a, b) => b.area - a.area)
                : currentCountries.sort((a, b) => a.area - b.area);
            sortFlags.area = !sortFlags.area;
            showCountries(currentCountries);
        }

        function sortByDensity() {
            sortFlags.density
                ? currentCountries.sort((a, b) => (b.population / b.area) - (a.population / a.area))
                : currentCountries.sort((a, b) => (a.population / a.area) - (b.population / b.area));
            sortFlags.density = !sortFlags.density;
            showCountries(currentCountries);
        }

        /*
         * TABLE CREATOR
         */
        function showCountries(data) {
            document.getElementById('output').innerHTML = '';
            if (allCountries == null) {
                allCountries = data;
                currentCountries = data;
            }
            document.getElementById('countryCount').innerHTML = data.length;

            if (!isInitialized) {
                sortByPopulation();
            }

            let table = document.createElement('table');
            createHeaderRow(table);

            let rank = 1;
            for (let c of data) {
                createCountryRow(table, rank, c);
                rank++;
            }

            isInitialized = true;
            populateRegionSelect();
            document.getElementById('output').append(table);
        }

        function createHeaderRow(table) {
            let hEl =
                `
                <tr>
                    <th class="" onclick="()">Rank</th>
                    <th class="clickable" onclick="sortByName()">Name</th>
                    <th class="clickable" onclick="sortByRegion()">Region</th>
                    <th class="clickable" onclick="sortBySubRegion()">Subregion</th>
                    <th class="clickable" onclick="sortByPopulation()">Population</th>
                    <th class="clickable" onclick="sortByCapital()">Capital</th>
                    <th class="clickable" onclick="sortByArea()">Area</th>
                    <th class="clickable" onclick="sortByDensity()">Density</th>
                    <th>Flag</th>
                </tr>
                `

            $(table).append(hEl);
        }

        function createCountryRow(table, rank, data) {
            let rEl =
                `
                    <tr onclick="selectRow(this)">
                        <td>${rank}</td>
                        <td>${data.name.common}</td>
                        <td>${data.region}</td>
                        <td>${data.subregion}</td>
                        <td>${data.population.toLocaleString('nl')}</td>
                        <td>${data.capital}</td>
                        <td>${data.area.toFixed(2)} square km</td>
                        <td>${(data.population / data.area).toFixed(2)} people/square km</td>
                        <td>
                            <img src="${data.flags.svg}" width="100" title="${data.flags.alt}">
                        </td>
                    </tr>
                    `;
            $(table).append(rEl);
        }

        function populateRegionSelect() {
            let allRegions = currentCountries.map(c => c.region);
            regionList = new Set(allRegions);

            let regionSelect = $('#regionSelect');
            regionSelect.html(`
                <option value="">-- Select a region --</option>
            `);

            regionList.forEach((r) => {
                let option = `<option value="${r}">${r}</option>`
                regionSelect.append(option);
            });
        }

        /*
         * FILTERS
         */
        function europeanCountries() {
            currentCountries = currentCountries.filter(c => c['region'] === 'Europe');
            showCountries(currentCountries);
        }

        function bigCountries() {
            currentCountries = currentCountries.filter(c => c['population'] > 100_000_000);
            showCountries(currentCountries);
        }

        function searchCountry() {
            let searchString = $('#countryInput').val()
                .toLowerCase();
            currentCountries = currentCountries.filter(
                c => c.name.common.toLowerCase().includes(searchString)
            );
            showCountries(currentCountries);
        }

        function filterByRegion(region) {
            currentCountries = currentCountries.filter(
                c => c.region.toLowerCase().includes(region.toLowerCase())
            );
            showCountries(currentCountries);
        }

        /*
         * ROW SELECTOR
         */
        function selectRow(tr) {
            const row = $(tr);

            if (row.hasClass('selected')) {
                row.removeClass('selected');
                return;
            }

            $('tr').removeClass('selected');
            row.addClass('selected');
        }

        /*
         * RESET
         */
        function resetCountries() {
            currentCountries = allCountries;
            $('#countryInput').val('');
            showCountries(currentCountries);
        }

        /*
         * NAVBAR INIT
         */
        document.addEventListener('navbarLoaded', () => {
            $("#menu").menu();
        });

        /*
        * TODO
        *  [x] 1) Dropdownlist met alle regions
        *  [x] 2) Andere velden:
        *           - c.area => bevolkingsdichtheid, tonen en sorteren
        *      3) Als je op een land klikt dan is dat land geselecteerd en moet die in een andere kleur getoond worden
        * */
    </script>
</head>
<body onload="init()">

<svg width="100" height="100">
    <circle cx="50" cy="50" r="40" stroke="red" stroke-width="4" fill="yellow"/>
</svg>

<div id="filterContainer">
    <h1>Alle landen van de wereld</h1>

    <p id="aantal">Er zijn <span id="countryCount">0</span> landen</p>

    <label for="countryInput">Country search:</label>
    <input id="countryInput" oninput="searchCountry()" type="text">
    <br><br>

    <button id="europeBtn" onclick="europeanCountries()">Europe</button>
    <button id="bigCountryBtn" onclick="bigCountries()">Big countries</button>
    <br>

    <label for="regionSelect">Region select:</label>
    <select id="regionSelect"></select>
    <br><br>

    <button id="resetBtn" onclick="resetCountries()">Reset country list</button>
    <br><br>
</div>

<div id="output"></div>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Leaflet</title>

    <!-- Navbar import -->
    <!-- CDN imports -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <script src="../common/load-navbar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Styles -->
    <style>
        #mapContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map {
            height: 40rem;
            width: 100%;
        }

        select {
            width: 400px;
        }

        #flyHome {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div id="mapContainer">
    <div id="map"></div>
</div>
<div>
    <label for="countries">Select a country:</label>
    <select id="countries">
        <option value="">Select a country</option>
    </select>

    <label for="railwayStations">Select a railway station:</label>
    <select id="railwayStations">
        <option value="">Select a station</option>
    </select>
    <br>
    <button id="flyHome">Fly home</button>
</div>
<script>
    $(() => {
        const countries = $('#countries');
        const railwayStations = $('#railwayStations');
        const flyHomeBtn = $('#flyHome');
        const map = L.map('map').setView([51.584455, 4.822408], 8);

        // Map setup
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'LO &copy; 2025'
        }).addTo(map);

        L.marker([51.584455, 4.822408]).addTo(map);
        var popup = L.popup();

        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent("You clicked the map at " + e.latlng.toString())
                .openOn(map);
        }

        // Event listeners
        countries.on('change', async (event) => {
            railwayStations.val('');
            let dataset = event.target.selectedOptions[0].dataset;
            let coords = await loadCoordinates(dataset.city, dataset.country);
            flyTo(coords);
        });

        railwayStations.on('change', async (event) => {
            countries.val('');
            let dataset = event.target.selectedOptions[0].dataset;
            let coords = {lat: dataset.lat, lon: dataset.lon};
            flyTo(coords, 15);
        })

        flyHomeBtn.on('click', getHomePositionAndFly);

        map.on('click', onMapClick);

        // Data getters
        async function showCountries() {
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,capital');

                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                data.sort((a, b) => a.name.common.localeCompare(b.name.common));

                data.forEach((country) => {
                    let el = document.createElement('option');
                    el.textContent = country.name.common + ': ' + country.capital;
                    el.dataset.country = country.name.common;
                    el.dataset.city = country.capital;
                    countries.append(el);
                });
            } catch (err) {
                console.error('Failed to load country data:', err);
            }
        }

        async function getRailwayStations() {
            try {
                const response = await fetch('https://xanderwemmers.nl/api/ns');

                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();

                console.log(data[0]);
                data.forEach((station) => {
                    let el = document.createElement('option');
                    el.textContent = station.Name;
                    el.dataset.lat = station.Lat;
                    el.dataset.lon = station.Long;
                    railwayStations.append(el);

                    let coords = {lat: station.Lat, lon: station.Long};
                    setCircle(coords, station.Name);
                });

            } catch (err) {
                console.error('Failed to load railway station data:', err);
            }
        }

        async function loadCoordinates(city, country) {
            try {
                const response = await fetch(
                    // `https://geocode.maps.co/search?city=${city}&country=${country}&api_key=69162e7fd7535924539248eul35da67`
                    `https://geocode.maps.co/search?country=${country}&api_key=69162e7fd7535924539248eul35da67`
                );
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                return {
                    'lon': data[0].lon,
                    'lat': data[0].lat
                };
            } catch (err) {
                console.error('Failed to load coordinate data:', err);
            }
        }

        // Helper functions
        function flyTo(coords, zoom = 9) {
            clearMarkers();
            map.flyTo([coords.lat, coords.lon], zoom);
            setMarker(coords);
        }

        function flyHome(data) {
            let lat = data.coords.latitude;
            let lon = data.coords.longitude;

            countries.val('');
            railwayStations.val('');

            map.flyTo([lat, lon], 11);
            clearMarkers();
            setMarker({lat: lat, lon: lon});
        }

        function clearMarkers() {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
        }

        function setMarker(coords) {
            L.marker([coords.lat, coords.lon]).addTo(map);
        }

        function setCircle(coords, name = null) {
            let circle = L.circle(
                {
                    lat: coords.lat,
                    lon: coords.lon
                },
                {
                    radius: 200
                }
            );

            if (name) {
                circle.bindPopup(name);
            }

            circle.addTo(map);
        }

        function getHomePositionAndFly() {
            navigator.geolocation.getCurrentPosition(flyHome);
        }

        // On load
        function init() {
            getRailwayStations();
            showCountries();

        }
        document.addEventListener('navbarLoaded', () => {
            $("#menu").menu();
        });
        init();
    });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Gegevens</title>

    <script src="../common/load-navbar.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"
            integrity="sha256-9zljDKpE/mQxmaR4V2cGVaQ7arF3CcXxarvgr7Sj8Uc=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/humanity/jquery-ui.css"
          crossorigin="anonymous">

    <style>
        input:invalid {
            border: 1px solid red;
            background: pink;
        }
    </style>
</head>
<body>
<div>
    <h1>Mijn gegevens</h1>

    <label for="name">Voornaam</label>
    <input type="text" id="name" required/>

    <label for="lastName">Achternaam</label>
    <input type="text" id="lastName" required/>

    <label for="dateOfBirth">Geboortedatum</label>
    <input type="text" id="dateOfBirth" required/>

    <label for="colorPicker">Kleur</label>
    <input type="color" id="colorPicker"/>
    <br>
    <br>
    <button id="saveBtn">Opslaan</button>
    <button id="loadBtn">Laden</button>
    <button id="clearBtn">Wissen</button>

    <div id="dialog" title="Oeps!" style="display: none;">
        <p>Niet al je velden zijn correct ingevuld</p>
    </div>
</div>
<script>
    $(() => {
        const saveBtn = $('#saveBtn');
        const loadBtn = $('#loadBtn');
        const clearBtn = $('#clearBtn');

        const name = $('#name');
        const lastName = $('#lastName');
        const dOB = $('#dateOfBirth');
        const colorPicker = $('#colorPicker');
        const dialog = $("#dialog");

        // Helper functions
        const getFormData = () => ({
            name: name.val(),
            lastName: lastName.val(),
            dateOfBirth: dOB.val(),
            color: colorPicker.val()
        });

        const setFormData = (data) => {
            name.val(data.name);
            lastName.val(data.lastName);
            dOB.val(data.dateOfBirth);
            colorPicker.val(data.color);
        }

        const saveToLocalStorage = (data) => {
            localStorage.setItem('mijnData', JSON.stringify(data));
        };

        const loadFromLocalStorage = () => {
            const raw = localStorage.getItem('mijnData');
            return raw ? JSON.parse(raw) : null;
        };

        // Event handlers
        saveBtn.on('click', () => {
            const invalids = $('input:invalid');

            if (invalids.length > 0) {
                dialog.show().dialog();
                return;
            }
            const data = getFormData();
            saveToLocalStorage(data);
        });

        loadBtn.on('click', () => {
            const data = loadFromLocalStorage();
            if (data) setFormData(data);
        });

        clearBtn.on('click', () => $('input').val(''));

        // Initialize date picker
        dOB.datepicker();

        document.addEventListener('navbarLoaded', () => {
            $("#menu").menu();
        });
    });
</script>

</body>
</html>
